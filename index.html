<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      height: fit-content;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 28px 28px 24px;
      color: #fff;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .summary {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.8;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 20px 20px 0;
    }

    .input-row input {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #667eea; }

    .input-row input::placeholder { color: #a0aec0; }

    .btn-add {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 22px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      line-height: 1;
    }

    .btn-add:hover { opacity: 0.88; }
    .btn-add:active { transform: scale(0.95); }

    .list {
      list-style: none;
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      font-size: 14px;
      padding: 40px 0;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f7fafc;
      border-radius: 12px;
      padding: 14px 16px;
      transition: background 0.15s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item.checked { background: #f0fff4; }

    .item-check {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e0;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .item.checked .item-check {
      background: #48bb78;
      border-color: #48bb78;
    }

    .item-check::after {
      content: '';
      display: none;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .item.checked .item-check::after { display: block; }

    .item-text {
      flex: 1;
      font-size: 15px;
      color: #2d3748;
      transition: color 0.2s;
      word-break: break-all;
    }

    .item.checked .item-text {
      color: #a0aec0;
      text-decoration: line-through;
    }

    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e0;
      font-size: 18px;
      padding: 4px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #fc8181; background: #fff5f5; }

    .footer {
      border-top: 1px solid #edf2f7;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer span { font-size: 13px; color: #a0aec0; }

    .btn-clear {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #fc8181;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-clear:hover { background: #fff5f5; }
    .btn-clear:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>🛒 쇼핑 리스트</h1>
      <p class="summary" id="summary">항목이 없습니다</p>
    </div>

    <div class="input-row">
      <input id="input" type="text" placeholder="아이템 추가..." maxlength="60" />
      <button class="btn-add" id="btnAdd" title="추가">+</button>
    </div>

    <ul class="list" id="list"></ul>

    <div class="footer">
      <span id="footerInfo"></span>
      <button class="btn-clear" id="btnClear">완료 항목 삭제</button>
    </div>
  </div>

  <script>
    const input   = document.getElementById('input');
    const btnAdd  = document.getElementById('btnAdd');
    const list    = document.getElementById('list');
    const summary = document.getElementById('summary');
    const footerInfo = document.getElementById('footerInfo');
    const btnClear   = document.getElementById('btnClear');

    let items = JSON.parse(localStorage.getItem('shopping') || '[]');

    function save() {
      localStorage.setItem('shopping', JSON.stringify(items));
    }

    function render() {
      list.innerHTML = '';

      if (items.length === 0) {
        list.innerHTML = '<li class="empty">아이템을 추가해 보세요 ✏️</li>';
      } else {
        items.forEach((item, i) => {
          const li = document.createElement('li');
          li.className = 'item' + (item.checked ? ' checked' : '');

          li.innerHTML = `
            <div class="item-check" data-i="${i}" title="완료 토글"></div>
            <span class="item-text">${escape(item.text)}</span>
            <button class="btn-delete" data-i="${i}" title="삭제">✕</button>
          `;

          list.appendChild(li);
        });
      }

      const total   = items.length;
      const checked = items.filter(it => it.checked).length;

      summary.textContent = total === 0
        ? '항목이 없습니다'
        : `총 ${total}개 · 완료 ${checked}개`;

      footerInfo.textContent = total > 0 ? `${total - checked}개 남음` : '';
      btnClear.disabled = checked === 0;
    }

    function escape(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function addItem() {
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      items.unshift({ text, checked: false });
      save();
      render();
      input.value = '';
      input.focus();
    }

    list.addEventListener('click', e => {
      const check = e.target.closest('.item-check');
      const del   = e.target.closest('.btn-delete');

      if (check) {
        const i = +check.dataset.i;
        items[i].checked = !items[i].checked;
        save(); render();
      }
      if (del) {
        const i = +del.dataset.i;
        items.splice(i, 1);
        save(); render();
      }
    });

    btnAdd.addEventListener('click', addItem);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    btnClear.addEventListener('click', () => {
      items = items.filter(it => !it.checked);
      save(); render();
    });

    render();
  </script>
</body>
</html>
