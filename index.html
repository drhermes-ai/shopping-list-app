<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      height: fit-content;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 28px 28px 24px;
      color: #fff;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .summary {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.8;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 20px 20px 0;
    }

    .input-row input {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #667eea; }
    .input-row input::placeholder { color: #a0aec0; }
    .input-row input:disabled { background: #f7fafc; }

    .btn-add {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 22px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      line-height: 1;
    }

    .btn-add:hover { opacity: 0.88; }
    .btn-add:active { transform: scale(0.95); }
    .btn-add:disabled { opacity: 0.5; cursor: default; }

    .list {
      list-style: none;
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      font-size: 14px;
      padding: 40px 0;
    }

    .loading {
      text-align: center;
      color: #a0aec0;
      font-size: 14px;
      padding: 40px 0;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f7fafc;
      border-radius: 12px;
      padding: 14px 16px;
      transition: background 0.15s, opacity 0.2s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item.checked { background: #f0fff4; }
    .item.busy { opacity: 0.5; pointer-events: none; }

    .item-check {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e0;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .item.checked .item-check {
      background: #48bb78;
      border-color: #48bb78;
    }

    .item-check::after {
      content: '';
      display: none;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .item.checked .item-check::after { display: block; }

    .item-text {
      flex: 1;
      font-size: 15px;
      color: #2d3748;
      transition: color 0.2s;
      word-break: break-all;
    }

    .item.checked .item-text {
      color: #a0aec0;
      text-decoration: line-through;
    }

    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e0;
      font-size: 18px;
      padding: 4px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #fc8181; background: #fff5f5; }

    .footer {
      border-top: 1px solid #edf2f7;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer span { font-size: 13px; color: #a0aec0; }

    .btn-clear {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #fc8181;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-clear:hover { background: #fff5f5; }
    .btn-clear:disabled { opacity: 0.4; cursor: default; }

    .error-bar {
      background: #fff5f5;
      color: #c53030;
      font-size: 13px;
      padding: 10px 20px;
      display: none;
    }
    .error-bar.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>🛒 쇼핑 리스트</h1>
      <p class="summary" id="summary">불러오는 중...</p>
    </div>

    <div class="error-bar" id="errorBar"></div>

    <div class="input-row">
      <input id="input" type="text" placeholder="아이템 추가..." maxlength="60" disabled />
      <button class="btn-add" id="btnAdd" title="추가" disabled>+</button>
    </div>

    <ul class="list" id="list"></ul>

    <div class="footer">
      <span id="footerInfo"></span>
      <button class="btn-clear" id="btnClear" disabled>완료 항목 삭제</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL  = 'https://svqkralmewttprashjfr.supabase.co'
    const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cWtyYWxtZXd0dHByYXNoamZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NjYzNTksImV4cCI6MjA5NDE0MjM1OX0.B4STRvNkMsUYPhHljdYDs7J6NHI0hb7ZwL2oljAj0RU'
    const db = createClient(SUPABASE_URL, SUPABASE_KEY)

    const input      = document.getElementById('input')
    const btnAdd     = document.getElementById('btnAdd')
    const list       = document.getElementById('list')
    const summary    = document.getElementById('summary')
    const footerInfo = document.getElementById('footerInfo')
    const btnClear   = document.getElementById('btnClear')
    const errorBar   = document.getElementById('errorBar')

    let items = []

    function showError(msg) {
      errorBar.textContent = msg
      errorBar.classList.add('visible')
      setTimeout(() => errorBar.classList.remove('visible'), 4000)
    }

    function escape(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function render() {
      list.innerHTML = ''

      if (items.length === 0) {
        list.innerHTML = '<li class="empty">아이템을 추가해 보세요 ✏️</li>'
      } else {
        items.forEach(item => {
          const li = document.createElement('li')
          li.className = 'item' + (item.checked ? ' checked' : '')
          li.dataset.id = item.id
          li.innerHTML = `
            <div class="item-check" title="완료 토글"></div>
            <span class="item-text">${escape(item.text)}</span>
            <button class="btn-delete" title="삭제">✕</button>
          `
          list.appendChild(li)
        })
      }

      const total   = items.length
      const checked = items.filter(it => it.checked).length

      summary.textContent = total === 0
        ? '항목이 없습니다'
        : `총 ${total}개 · 완료 ${checked}개`

      footerInfo.textContent = total > 0 ? `${total - checked}개 남음` : ''
      btnClear.disabled = checked === 0
    }

    function setLoading(on) {
      input.disabled  = on
      btnAdd.disabled = on
    }

    async function loadItems() {
      list.innerHTML = '<li class="loading">불러오는 중...</li>'
      const { data, error } = await db
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: false })

      if (error) { showError('데이터를 불러오지 못했습니다.'); return }
      items = data
      setLoading(false)
      render()
    }

    async function addItem() {
      const text = input.value.trim()
      if (!text) { input.focus(); return }

      setLoading(true)
      const { data, error } = await db
        .from('shopping_items')
        .insert({ text, checked: false })
        .select()
        .single()

      setLoading(false)
      if (error) { showError('추가에 실패했습니다.'); return }

      items.unshift(data)
      render()
      input.value = ''
      input.focus()
    }

    async function toggleItem(id) {
      const item = items.find(it => it.id === id)
      if (!item) return

      const li = list.querySelector(`[data-id="${id}"]`)
      if (li) li.classList.add('busy')

      const { error } = await db
        .from('shopping_items')
        .update({ checked: !item.checked })
        .eq('id', id)

      if (error) { showError('수정에 실패했습니다.'); if (li) li.classList.remove('busy'); return }

      item.checked = !item.checked
      render()
    }

    async function deleteItem(id) {
      const li = list.querySelector(`[data-id="${id}"]`)
      if (li) li.classList.add('busy')

      const { error } = await db
        .from('shopping_items')
        .delete()
        .eq('id', id)

      if (error) { showError('삭제에 실패했습니다.'); if (li) li.classList.remove('busy'); return }

      items = items.filter(it => it.id !== id)
      render()
    }

    async function clearChecked() {
      const ids = items.filter(it => it.checked).map(it => it.id)
      if (!ids.length) return

      btnClear.disabled = true
      const { error } = await db
        .from('shopping_items')
        .delete()
        .in('id', ids)

      if (error) { showError('삭제에 실패했습니다.'); render(); return }

      items = items.filter(it => !it.checked)
      render()
    }

    list.addEventListener('click', e => {
      const li  = e.target.closest('.item')
      if (!li) return
      const id  = li.dataset.id

      if (e.target.closest('.item-check'))  toggleItem(id)
      if (e.target.closest('.btn-delete'))  deleteItem(id)
    })

    btnAdd.addEventListener('click', addItem)
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem() })
    btnClear.addEventListener('click', clearChecked)

    loadItems()
  </script>
</body>
</html>
